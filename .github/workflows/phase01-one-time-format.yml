name: Phase01 one-time source formatter
# Temporary maintenance workflow. Remove once a format commit is produced.
on:
  push:
    branches: [feat/next-phase-01]
permissions:
  contents: write
jobs:
  format-once:
    if: github.repository == '0xstillb/Grimmlink-Next'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/next-phase-01
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format workspace and commit only formatted source
        run: |
          set -euo pipefail
          pnpm exec prettier --write apps packages
          git add -u -- apps packages
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "style(phase-01): apply workspace Prettier formatting"
            git push origin HEAD:refs/heads/feat/next-phase-01
          fi
