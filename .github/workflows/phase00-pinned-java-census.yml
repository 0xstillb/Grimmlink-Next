name: Phase 00 pinned Java source route census
on:
  push:
    branches: [feat/next-phase-00]
    paths:
      - "scripts/phase-00/**"
      - ".github/workflows/phase00-pinned-java-census.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pinned-source-ast-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout audit branch (no production credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Set up JDK for Java AST syntax-only parsing
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch exact pinned upstream source without executing it
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/grimmory-source
          git -C /tmp/grimmory-source init -q
          git -C /tmp/grimmory-source remote add origin https://github.com/grimmory-tools/grimmory.git
          git -C /tmp/grimmory-source fetch --no-tags --depth=1 origin 402e89b4452f8e2b17ab95f16c1621c003516cd2
          git -C /tmp/grimmory-source checkout --quiet --detach 402e89b4452f8e2b17ab95f16c1621c003516cd2
          test "$(git -C /tmp/grimmory-source rev-parse HEAD)" = "402e89b4452f8e2b17ab95f16c1621c003516cd2"
      - name: Fetch immutable locked Spring MediaType source with Git blob verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase00-dependencies
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            https://raw.githubusercontent.com/spring-projects/spring-framework/82a6b40b9366ec181ededdad282b307ee5381a52/spring-web/src/main/java/org/springframework/http/MediaType.java \
            -o /tmp/phase00-dependencies/MediaType.java
          test "$(git hash-object /tmp/phase00-dependencies/MediaType.java)" = "1d7ecf7fff9ad63926ea2ea00f54d39aecf12cff"
          grep -q '^org.springframework:spring-web:7\.0\.9=' /tmp/grimmory-source/backend/gradle.lockfile
      - name: Generate content-verified AST census (no upstream code execution)
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python3 scripts/phase-00/scan-java-routes.py --upstream /tmp/grimmory-source --output /tmp/phase00-static
          scan_exit=$?
          set -e
          if [ "$scan_exit" -ne 0 ] && [ "$scan_exit" -ne 3 ]; then exit "$scan_exit"; fi
          python3 -m unittest discover -s scripts/phase-00 -p "test_route_expansion.py" -v
          python3 scripts/phase-00/expand-route-mappings.py /tmp/phase00-static/SOURCE-ROUTE-CANDIDATES.json /tmp/phase00-static/SOURCE-DECLARED-MAPPING-EXPANSION.json
          python3 -m unittest discover -s scripts/phase-00 -p "test_source_semantics.py" -v
          python3 scripts/phase-00/audit-source-semantics.py --upstream /tmp/grimmory-source --census /tmp/phase00-static/JAVA-SOURCE-WIDE-CENSUS.json --expansion /tmp/phase00-static/SOURCE-DECLARED-MAPPING-EXPANSION.json --output /tmp/phase00-static --framework-media-type /tmp/phase00-dependencies/MediaType.java
          python3 scripts/phase-00/validate-manual-acl-traces.py --upstream /tmp/grimmory-source --manual docs/implementation/phase-00/SOURCE-ACL-CALLCHAIN-TRACE.json --ledger /tmp/phase00-static/SOURCE-AUTH-OWNERSHIP-LEDGER.json --output /tmp/phase00-static/SOURCE-ACL-TRACE-VALIDATION.json
          python3 scripts/phase-00/validate-negative-fixtures.py docs/implementation/phase-00/SECURITY-NEGATIVE-FIXTURES.json /tmp/phase00-static/FIXTURE-STATIC-VALIDATION.json
          for file in JAVA-SOURCE-WIDE-CENSUS.json SOURCE-ROUTE-CANDIDATES.json SOURCE-ROUTE-OWNERSHIP-GAPS.md JAVA-SOURCE-WIDE-CENSUS-RECEIPT.md FIXTURE-STATIC-VALIDATION.json SOURCE-DECLARED-MAPPING-EXPANSION.json SOURCE-CONDITION-RESOLUTION.json SOURCE-AUTH-OWNERSHIP-LEDGER.json SOURCE-AUTH-REVIEW-QUEUE.md SOURCE-ACL-TRACE-VALIDATION.json; do
            cp "/tmp/phase00-static/$file" "docs/implementation/phase-00/$file"
          done
          python3 - <<'PY'
          import json
          p='docs/implementation/phase-00/JAVA-SOURCE-WIDE-CENSUS.json'
          j=json.load(open(p))
          assert j['filesEnumerated']==923, j['filesEnumerated']
          assert j['contentReadAndBlobShaVerified']==923
          assert j['astParsedFiles']==923
          print('AST diagnostic errors:',len(j['astErrors']))
          for error in j['astErrors'][:30]: print(error)
          assert j['SOURCE_ANNOTATION_COMPLETE'] is False
          assert j['RUNTIME_ROUTE_COMPLETE']=='NOT_RUN'
          print('Content coverage verified; AST diagnostics require review and source semantics remain BLOCKED')
          PY
      - name: Commit generated evidence only if branch is unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add docs/implementation/phase-00/JAVA-SOURCE-WIDE-CENSUS.json docs/implementation/phase-00/JAVA-SOURCE-WIDE-CENSUS-RECEIPT.md docs/implementation/phase-00/SOURCE-ROUTE-CANDIDATES.json docs/implementation/phase-00/SOURCE-ROUTE-OWNERSHIP-GAPS.md docs/implementation/phase-00/FIXTURE-STATIC-VALIDATION.json docs/implementation/phase-00/SOURCE-DECLARED-MAPPING-EXPANSION.json docs/implementation/phase-00/SOURCE-CONDITION-RESOLUTION.json docs/implementation/phase-00/SOURCE-AUTH-OWNERSHIP-LEDGER.json docs/implementation/phase-00/SOURCE-AUTH-REVIEW-QUEUE.md docs/implementation/phase-00/SOURCE-ACL-TRACE-VALIDATION.json
          if git diff --cached --quiet; then echo "No changed evidence"; exit 0; fi
          git fetch origin feat/next-phase-00
          current="$(git rev-parse FETCH_HEAD)"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "::error::Concurrent branch update. Refusing to overwrite; preserve run log for rebase."
            exit 12
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(phase-00): record pinned full-source AST scan evidence (unreviewed)"
          git push origin HEAD:refs/heads/feat/next-phase-00

      - name: Preserve failure status when AST diagnostics remain
        shell: bash
        run: |
          python3 - <<'PY'
          import json,sys
          j=json.load(open('docs/implementation/phase-00/JAVA-SOURCE-WIDE-CENSUS.json'))
          count=len(j['astErrors'])
          if count: print('::error::Unresolved Java AST diagnostics: '+str(count))
          sys.exit(3 if count else 0)
          PY
