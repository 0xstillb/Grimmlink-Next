name: Phase06 One-off Formatter (feature branch only)
on:
  push:
    branches: [feat/next-phase-06]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format-feature:
    if: github.ref == 'refs/heads/feat/next-phase-06'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: feat/next-phase-06
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format only Phase06 TS sources and tests, commit if changed
        run: |
          set -euo pipefail
          pnpm exec prettier --write packages/sync/src/phase06.ts packages/sync/src/phase06.test.ts packages/persistence/src/phase06-progress.ts packages/persistence/src/phase06-progress.test.ts
          git add packages/sync/src/phase06.ts packages/sync/src/phase06.test.ts packages/persistence/src/phase06-progress.ts packages/persistence/src/phase06-progress.test.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(phase-06): apply pinned Prettier to offline progress"
            git push origin HEAD:refs/heads/feat/next-phase-06
          fi
